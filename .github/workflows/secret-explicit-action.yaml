name: Secret Explicit Workflow

on:
  workflow_dispatch:  

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: sidj-thr-org/actions/.github/actions/explicit-secrets@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}