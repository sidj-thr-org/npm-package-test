# Example: invoke publish.yml via workflow_call. Do not duplicate tag triggers here or
# both workflows would run on every tag push. Tag releases use publish.yml directly.

name: Invoke publish (reusable)

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps: 
      - uses: sidj-thr-org/actions/.github/actions/npm-publish@main
        with:
          git-ref: ${{ github.ref }}
