# Publishes via sidj-thr-org/actions publish-library-to-npm (token auth).
# Repo secret NPM_TOKEN is required. npm "release" Environment should match your npm trust config.

name: Publish Package

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "18.x"
        registry-url: "https://registry.npmjs.org/"
        scope: "@sidj-thr"

    - name: Setup npm
      shell: bash
      run: npm install -g npm@11.10.0
