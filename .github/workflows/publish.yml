# Trusted publishing (OIDC). Setup docs: .github/actions/npm-publish/action.yml
#
# npm trust must match this workflow file name (publish.yml) and, if used, GitHub
# Environment "release" on the publish job below.

name: Publish Package

on:
  # push:
  #   tags:
  #     - "v*"
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: sidj-thr-org/actions/.github/actions/publish-library-to-npm@main
        with:
          git-ref: ${{ github.ref }}
