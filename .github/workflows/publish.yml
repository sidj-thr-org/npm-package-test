# Publishes via sidj-thr-org/actions publish-library-to-npm (token auth).
# Repo secret NPM_TOKEN is required. npm "release" Environment should match your npm trust config.

name: Publish Package (NPM Trust)

on:
  # push:
  #   tags:
  #     - "v*"
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
    inputs:
      tag:
        type: string
        required: false
        default: latest
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Stream (npm dist-tag)"
        required: false
        default: "latest"

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: sidj-thr-org/actions/.github/actions/publish-library-to-npm-trust@main
        with:
          workdir: .
          tag: ${{ inputs.tag }}
          create-tag: true
          npm_package_scope: "@sidj-thr"
          npm_package_access: "public"
