name: NPM Publish (OIDC)
description: >
  Minimal OIDC npm publish for @sidj-thr/* packages. Asserts release-* branch
  (defense-in-depth), configures setup-node for token injection, and publishes
  with provenance. Callers MUST resolve the dist-tag using dist-tag-determination
  before invoking this action.

inputs:
  workdir:
    description: "Directory containing package.json."
    required: true
  tag:
    description: "npm dist-tag to publish under (resolved by dist-tag-determination)."
    required: true
  npm_package_access:
    description: "npm publish access: public or restricted."
    required: false
    default: "public"

outputs:
  npm_published_version:
    description: "Version published to npm."
    value: ${{ steps.publish.outputs.npm_published_version }}

runs:
  using: composite
  steps:
    - name: Assert release branch
      shell: bash
      env:
        GHA_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        if [[ "${GHA_REF}" != refs/heads/release-* ]]; then
          echo "::error::npm-publish must only be invoked from a release-* branch (got: ${GHA_REF}). Callers must gate on release-* refs."
          exit 1
        fi

    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
      with:
        node-version: "24.14.1"
        registry-url: https://registry.npmjs.org/
        scope: "@sidj-thr"

    - name: Publish to npm
      id: publish
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        RESOLVED_TAG: ${{ inputs.tag }}
        INPUT_ACCESS: ${{ inputs.npm_package_access }}
      run: |
        set -euo pipefail
        if [ "${INPUT_ACCESS}" = "public" ]; then
          npm publish --tag "${RESOLVED_TAG}" --access "${INPUT_ACCESS}" --provenance
        else
          npm publish --tag "${RESOLVED_TAG}" --access "${INPUT_ACCESS}"
        fi
        echo "npm_published_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
